<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网址已更新</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #1e2a3a 0%, #34455e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #34455e;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; color: #1e2a3a; margin-bottom: 10px; }
    .line { width: 40px; height: 3px; background: #f0a500; border-radius: 2px; margin: 0 auto 18px; }
    p { font-size: 14px; color: #5a6b7d; line-height: 1.8; }
    .contact {
      margin-top: 22px;
      background: #f5f7fa;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #1e2a3a;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">KK</div>
    <h1>此网址已更新</h1>
    <div class="line"></div>
    <p>原报价系统已迁移至新地址，<br>请停止使用本网址。</p>
    <div class="contact">新网址请联系 KK 获取</div>
  </div>
</body>
</html>
