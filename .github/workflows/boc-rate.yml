name: BOC USD Rate

# 每天每 2 小时抓取中国银行美元现汇买入价（2026-08-22 改为含周末，原周一至周五周末不更新）
# UTC 0-22 偶数时 = 上海 8-次日6 时，覆盖中行牌价全天更新时段
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取中行牌价
        run: node scripts/fetch-boc-rate.js
      - name: 提交并推送（值有变化才提交）
        run: |
          git config user.name "kzy0606"
          git config user.email "kzy0606@users.noreply.github.com"
          git add rate.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新中行美元汇率（$(node -e "console.log(require('./rate.json').rate)")）"
            git push
          else
            echo "汇率未变化，跳过提交"
          fi
